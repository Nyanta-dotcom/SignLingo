[project]
name = "signlingo-ml"
version = "0.1.0"
description = "SignLingo AI — data & ML pipeline"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "scikit-image", "scipy", "pyarrow", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis", "matplotlib"]
dl = ["torch", "onnx", "onnxruntime"]  # torch CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
capture = ["opencv-python", "mediapipe"]  # only for ml/tools/capture.py (P1-21 data collection)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
