[project]
name = "signlingo-ml"
version = "0.1.0"
description = "SignLingo AI — data & ML pipeline"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "scikit-image", "scipy", "pyarrow", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
